resources:
  jobs:
    pipeline_cinedata:
      name: pipeline_cinedata
      schedule:
        quartz_cron_expression: 42 0 0 ? * Mon
        timezone_id: UTC
        pause_status: UNPAUSED
      tasks:
        - task_key: to_Bronze
          notebook_task:
            notebook_path: /Workspace/Users/joaomartires2@gmail.com/Landing_to_Bronze
            source: WORKSPACE
        - task_key: to_Silver
          depends_on:
            - task_key: to_Bronze
          notebook_task:
            notebook_path: /Workspace/Users/joaomartires2@gmail.com/Bronze_to_Silver
            source: WORKSPACE
        - task_key: to_Gold
          depends_on:
            - task_key: to_Silver
          notebook_task:
            notebook_path: /Workspace/Users/joaomartires2@gmail.com/Silver_to_Gold
            source: WORKSPACE
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
